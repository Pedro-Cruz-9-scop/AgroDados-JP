[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "postgresql_16.dev", "gcc"]

[phases.install]
cmds = ["python3 -m pip install -r requirements.txt"]

[phases.build]
cmds = ["python3 manage.py collectstatic --noinput"]

[start]
cmd = "python3 manage.py migrate --noinput && python3 -m gunicorn agrodados.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
