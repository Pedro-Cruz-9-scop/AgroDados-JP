<form method="post" action="{{ action }}" class="row-delete-form" data-delete-form>{% csrf_token %}<button class="btn ghost row-delete-button" type="button" data-open-delete aria-expanded="false" aria-label="Excluir {{ label }}">Excluir</button><div class="delete-confirmation" data-delete-confirmation hidden><label>Confirme sua senha<input type="password" name="password" autocomplete="current-password" required></label><div><button class="btn ghost row-delete-button" type="submit">Confirmar exclusão</button><button class="btn ghost" type="button" data-cancel-delete>Cancelar</button></div></div></form>
